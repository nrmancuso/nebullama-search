name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up JDK 21
        uses: actions/setup-java@v4.8.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.4

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ollama-cache
          key: ollama-models-${{ hashFiles('scripts/init.sh') }}

      - name: Bind Ollama cache into Docker Compose
        run: |
          mkdir -p ollama-cache
          cat > docker-compose.override.yml << 'EOF'
          services:
            ollama:
              volumes:
                - ./ollama-cache:/root/.ollama
          EOF
      
      - name: Build service jar
        run: ./gradlew :service:bootJar

      - name: Run integration tests
        run: CI=true ./scripts/run-integration-tests.sh
