<svg width="1600" height="640" viewBox="0 0 1600 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>nebullama-search README header</title>
  <desc>Minimal space-themed banner for nebullama-search.</desc>

  <defs>
    <linearGradient id="bg" x1="140" y1="50" x2="1460" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111833"/>
      <stop offset="0.55" stop-color="#1A1543"/>
      <stop offset="1" stop-color="#090C19"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 280) rotate(10) scale(260 180)">
      <stop offset="0" stop-color="#F28A52" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#C35D8D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6C56FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 220) rotate(180) scale(360 220)">
      <stop offset="0" stop-color="#61B2FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#61B2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="620" y1="110" x2="980" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8CC8FF"/>
      <stop offset="0.5" stop-color="#B687FF"/>
      <stop offset="1" stop-color="#F3C27A"/>
    </linearGradient>
    <filter id="starGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

